<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ئاسایشی سۆران - بەشی پاراستن</title>
    <style>
        body { font-family: Tahoma, sans-serif; background-color: #f4f6f8; margin: 0; padding: 20px; direction: rtl; }
        .container { max-width: 500px; background: white; padding: 20px; border-radius: 12px; margin: auto; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .header { background: #1B2A47; color: white; text-align: center; padding: 15px; border-radius: 8px; font-weight: bold; }
        .alert { background: #ffebee; border: 1px solid #ffcdd2; color: #c62828; padding: 12px; border-radius: 8px; margin: 15px 0; font-size: 14px; }
        label { display: block; margin-top: 15px; font-weight: bold; font-size: 14px; }
        input, select, textarea { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        button { width: 100%; background: #1B2A47; color: white; border: none; padding: 12px; border-radius: 6px; margin-top: 20px; font-size: 16px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">ئاسایشی سۆران - بەشی پاراستن و سکاڵا</div>
        <div class="alert">🔒 زانیارییەکانت بە تەواوی نهێنین و ڕاستەوخۆ دەگەنە دەست تیمی تایبەتمەند.</div>
        <form>
            <label>ناوی سیانی (ئارەزوومەندانە):</label>
            <input type="text" placeholder="ناوی تەواو">
            
            <label>ژمارەی مۆبایل:</label>
            <input type="tel" placeholder="07xx xxx xxxx">
            
            <label>جۆری سەرپێچی یان هەڕەشە:</label>
            <select>
                <option>هەڕەشەکردن و سەرانەسەندنی ئەلیکترۆنی</option>
                <option>بڵاوکردنەوە یان هەڕەشەی وێنە و ڤیدیۆی ڕووت</option>
                <option>تۆمارکردنی سکاڵای هاککردن</option>
                <option>بابەتی تری پەیوەندیدار</option>
            </select>
            
            <label>ڕوونکردنەوەی کێشەکە:</label>
            <textarea rows="4" placeholder="تکایە بە ڕوونی باسی هەڕەشەکە بکە..."></textarea>
            
            <button type="submit">ناردنی زانیارییەکان</button>
        </form>
    </div>
</body>
</html>
